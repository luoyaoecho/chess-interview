<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试风格匹配测试</title>
<style>
  :root {
    --bg: #f2ead8; --card: rgba(255,252,245,0.85); --accent: #8b2020; --accent2: #4a3028;
    --text: #332820; --sub: #8c7b68; --input-bg: rgba(255,252,245,0.7); --border: #d4c4a8;
    --tag-out: #3d7a9e; --tag-in: #6b3d8a; --tag-far: #3d8a5e;
    --tag-near: #8a6b3d; --tag-logic: #b04d3d; --tag-feel: #b08a3d;
    --tag-flex: #3d8a7a; --tag-fixed: #5b6b8a;
    --bar-high: #3a9d5e; --bar-mid: #b07820; --bar-low: #c04040;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
    background: var(--bg);
    background-image: url('images/shanshui_web.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-blend-mode: soft-light;
    color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .container { max-width: 760px; width: 100%; padding: 20px; }

  /* Header */
  .header { text-align: center; padding: 24px 0 12px; }
  .header h1 {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #8b2020, #b53836);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .header .subtitle { color: var(--sub); font-size: 14px; }
  .header .user-badge {
    display: inline-block; font-size: 12px; color: var(--sub);
    margin-top: 6px; padding: 2px 12px; border-radius: 12px;
    border: 1px solid var(--border);
  }

  /* 印章风格标签 */
  .seal-badge {
    display: inline-block; font-size: 11px; color: var(--accent);
    padding: 3px 12px; border: 1px solid var(--accent);
    font-weight: 700; letter-spacing: 2px;
    transform: rotate(-2deg);
  }

  /* Cards */
  .card {
    background: var(--card); border-radius: 16px; padding: 24px;
    margin-bottom: 16px; border: 1px solid var(--border);
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn { from {opacity:0;transform:translateY(10px);} to {opacity:1;transform:translateY(0);} }

  /* Progress */
  .progress-wrap { margin-bottom: 24px; }
  .progress-bar-wrap { background: var(--card); border-radius: 10px; height: 6px; overflow: hidden; margin-bottom: 6px; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 10px; transition: width 0.5s ease; }
  .step-indicator {
    display: flex; justify-content: space-between; font-size: 10px; color: var(--sub);
    flex-wrap: wrap; gap: 3px;
  }
  .step-indicator span.active { color: var(--accent); font-weight: 700; }
  .step-indicator span.done { color: var(--bar-high); }

  /* Buttons */
  .btn {
    padding: 12px 28px; border-radius: 10px; font-size: 15px;
    font-weight: 600; cursor: pointer; border: none; font-family: inherit;
    transition: all 0.3s;
  }
  .btn-next { background: var(--accent); color: #fff; flex: 1; border-radius: 8px; }
  .btn-next:hover { background: #6b1818; transform: translateY(-1px); }
  .btn-prev { background: transparent; color: var(--sub); border: 1px solid var(--border); }
  .btn-prev:hover { background: rgba(255,255,255,0.05); }
  .btn-restart {
    padding: 12px 40px; background: transparent; border: 1px solid var(--border);
    color: var(--sub); border-radius: 10px; cursor: pointer; font-family: inherit;
    font-size: 14px; transition: all 0.3s; margin: 0 8px;
  }
  .btn-restart:hover { border-color: var(--accent); color: var(--accent); }
  .btn-row { display: flex; gap: 12px; margin-top: 16px; }

  /* Login */
  .login-card { text-align: center; padding: 24px; }
  .login-card .logo { font-size: 48px; margin-bottom: 10px; }
  .login-card input[type=text] {
    width: 100%; max-width: 300px; padding: 12px 16px;
    background: var(--input-bg); color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    font-size: 16px; text-align: center; font-family: inherit;
    margin-bottom: 12px; transition: border-color 0.3s;
  }
  .login-card input[type=text]:focus { outline: none; border-color: var(--accent); }

  /* Reference panels on login page */
  .ref-section { margin-top: 28px; }
  .ref-section h3 {
    font-size: 15px; color: var(--accent); margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .ref-hint { font-size: 11px; color: var(--sub); margin-bottom: 12px; }
  .history-link {
    text-align: center; margin-top: 20px; font-size: 13px;
  }
  .history-link a {
    color: var(--sub); text-decoration: none; cursor: pointer;
    border-bottom: 1px dashed var(--border); padding-bottom: 2px;
  }
  .history-link a:hover { color: var(--accent); border-color: var(--accent); }

  /* Char overview cards (compact) */
  .char-overview-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-bottom: 18px;
  }
  @media (max-width: 600px) { .char-overview-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 400px) { .char-overview-grid { grid-template-columns: 1fr; } }
  .co-card {
    background: var(--input-bg); border-radius: 10px;
    padding: 12px 14px; border: 1px solid var(--border);
    text-align: center;
  }
  .co-card .co-name { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .co-card .co-struct { font-size: 10px; color: var(--sub); margin-bottom: 4px; }
  .co-card .co-core { font-size: 10px; color: var(--accent); }

  /* Radical compact table */
  .rad-compact-table { width: 100%; font-size: 11px; border-collapse: collapse; }
  .rad-compact-table th {
    text-align: left; padding: 6px 8px; color: var(--accent);
    font-weight: 600; border-bottom: 2px solid var(--border); font-size: 10px;
  }
  .rad-compact-table td {
    padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,0.04);
    line-height: 1.5;
  }
  .rad-compact-table .rc { font-size: 16px; font-weight: 700; color: var(--accent); width: 36px; text-align: center; }
  .rad-compact-table .rn { font-weight: 600; white-space: nowrap; }
  .rad-compact-table .ra { color: var(--accent2); font-size: 10px; white-space: nowrap; }

  /* Question scene */
  .scene-tag {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 12px; margin-bottom: 14px;
    background: rgba(139,32,32,0.10); color: var(--accent);
  }
  .scene-desc {
    font-size: 15px; line-height: 1.9; color: var(--text);
    background: var(--input-bg); border-radius: 10px;
    padding: 20px 22px; margin-bottom: 18px;
    border-left: 3px solid var(--accent);
    white-space: pre-wrap;
  }
  textarea.answer-input {
    width: 100%; min-height: 130px;
    background: var(--input-bg); color: var(--text);
    border: 2px solid var(--border); border-radius: 10px;
    padding: 14px 16px; font-size: 14px; line-height: 1.7;
    font-family: inherit; resize: vertical; transition: border-color 0.3s;
  }
  textarea.answer-input:focus { outline: none; border-color: var(--accent); }
  textarea.answer-input::placeholder { color: #555; }

  /* Analyzing */
  .analyzing { text-align: center; padding: 40px 20px; }
  .analyzing .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to {transform:rotate(360deg);} }
  .analyzing p { color: var(--sub); font-size: 14px; }

  /* Report */
  .report-section { margin-bottom: 28px; }
  .report-section h2 { font-size: 18px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: var(--accent); }
  .personality-type-box {
    background: linear-gradient(135deg, rgba(181,56,54,0.10), rgba(181,56,54,0.02));
    border: 2px solid var(--accent); border-radius: 16px;
    padding: 24px; text-align: center; margin-bottom: 20px;
  }
  .personality-type-box .type-name { font-size: 32px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
  .personality-type-box .type-detail { font-size: 14px; color: var(--sub); }
  .dim-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding: 10px 14px; background: var(--input-bg); border-radius: 8px; }
  .dim-row .dlabel { width: 56px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .dim-score { width: 32px; text-align: right; font-weight: 700; font-size: 14px; }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 500px) { .char-grid { grid-template-columns: 1fr; } }
  .char-card { background: var(--input-bg); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--border); }
  .char-card .char-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .char-card .char-parts { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .char-card .tightness-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11px; }
  .tightness-item .t-label { width: 24px; color: var(--sub); }
  .tightness-item .t-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
  .tightness-item .t-fill { height: 100%; border-radius: 3px; }
  .tightness-item .t-val { width: 16px; text-align: right; font-size: 10px; color: var(--sub); }
  .overall-tightness { font-size: 12px; color: var(--sub); margin-top: 6px; }

  .strategy-box {
    background: var(--input-bg); border-radius: 10px; padding: 18px 20px;
    border-left: 3px solid var(--accent); line-height: 1.9; font-size: 14px;
  }
  .strategy-box .tip-item { margin-bottom: 6px; }
  .strategy-box .tip-item::before { content: '▸ '; color: var(--accent); }

  .btn-row-center { text-align: center; margin-top: 24px; }

  /* Tags */
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
  .tag-out { background: rgba(91,140,191,0.2); color: var(--tag-out); }
  .tag-in { background: rgba(139,91,159,0.2); color: var(--tag-in); }
  .tag-far { background: rgba(91,159,123,0.2); color: var(--tag-far); }
  .tag-near { background: rgba(159,123,91,0.2); color: var(--tag-near); }
  .tag-logic { background: rgba(197,107,91,0.2); color: var(--tag-logic); }
  .tag-feel { background: rgba(197,155,91,0.2); color: var(--tag-feel); }
  .tag-flex { background: rgba(91,159,159,0.2); color: var(--tag-flex); }
  .tag-fixed { background: rgba(123,139,159,0.2); color: var(--tag-fixed); }

  /* History page (standalone) */
  .history-item {
    background: var(--input-bg); border-radius: 10px; padding: 14px 18px;
    margin-bottom: 10px; border: 1px solid var(--border); cursor: pointer;
    transition: all 0.2s; display: flex; justify-content: space-between; align-items: center;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-item .h-type { font-weight: 700; font-size: 15px; }
  .history-item .h-date { font-size: 11px; color: var(--sub); }
  .history-item .h-delete { color: var(--bar-low); cursor: pointer; font-size: 12px; padding: 4px 8px; }
  .history-item .h-delete:hover { background: rgba(202,91,91,0.1); border-radius: 4px; }
  .no-history { text-align: center; color: var(--sub); padding: 40px 20px; font-size: 14px; }
  .back-link { text-align: center; margin-top: 20px; }
  .back-link a { color: var(--sub); cursor: pointer; font-size: 13px; text-decoration: none; border-bottom: 1px dashed var(--border); padding-bottom: 2px; }
  .back-link a:hover { color: var(--accent); border-color: var(--accent); }

  /* ===== Chinese-style Layout ===== */
  .cn-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }
  @media (max-width: 680px) {
    .cn-layout { grid-template-columns: 1fr; }
  }
  .cn-card {
    background: linear-gradient(180deg, var(--input-bg) 0%, var(--input-bg) 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 18px;
    position: relative;
    overflow: hidden;
  }
  .cn-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }
  .cn-card .cn-icon {
    font-size: 20px; margin-right: 6px; vertical-align: -2px;
  }
  .cn-card h3 {
    font-size: 15px; color: var(--accent);
    margin: 0 0 10px 0; padding-bottom: 8px;
    border-bottom: 1px dashed rgba(181,56,54,0.18);
    letter-spacing: 1px;
  }
  .cn-card p {
    font-size: 12.5px; line-height: 1.85; color: #c8c8d0;
    margin-bottom: 8px;
  }
  .cn-card p strong { color: var(--accent); font-weight: 600; }
  .cn-card p .hl-red { color: #d4735a; font-weight: 600; }

  /* Stamp badge */
  .cn-stamp {
    display: inline-block;
    border: 2px solid #c43a31;
    color: #c43a31;
    padding: 2px 10px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px;
    transform: rotate(-3deg);
    opacity: 0.7;
    margin: 4px 0;
  }

  /* Four dimensions mini grid */
  .cn-dim-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .cn-dim-card {
    background: var(--input-bg);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 10px 12px;
    transition: border-color 0.3s;
  }
  .cn-dim-card:hover { border-color: rgba(181,56,54,0.25); }
  .cn-dim-card .dim-title {
    font-size: 13px; font-weight: 700; color: var(--accent);
    margin-bottom: 4px;
  }
  .cn-dim-card .dim-pair {
    font-size: 10px; line-height: 1.7; color: var(--sub);
  }
  .cn-dim-card .dim-pair span { font-weight: 600; }

  /* Character mini cards */
  .cn-char-mini-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .cn-char-mini {
    text-align: center;
    background: var(--input-bg);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 8px 4px;
    transition: border-color 0.3s;
  }
  .cn-char-mini:hover { border-color: rgba(181,56,54,0.25); }
  .cn-char-mini .cn-char-symbol {
    font-size: 26px; font-weight: 800;
    background: linear-gradient(135deg, #b8830a, #d4940b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .cn-char-mini .cn-char-parts {
    font-size: 9px; color: var(--sub); margin: 2px 0;
  }
  .cn-char-mini .cn-char-core {
    font-size: 9px; color: var(--accent); opacity: 0.8;
  }

  /* Radical dictionary full-width */
  .cn-dict-full {
    margin-top: 16px;
  }

  /* Decorative ornament */
  .cn-ornament {
    text-align: center; color: var(--accent);
    font-size: 12px; letter-spacing: 8px;
    opacity: 0.5; margin: 8px 0;
    user-select: none;
  }

  /* Login section at top */
  .cn-login-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; padding: 18px 20px;
    background: var(--card); border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .cn-login-bar .logo-icon { font-size: 36px; }
  .cn-login-bar input[type=text] {
    width: 180px; padding: 10px 14px;
    background: var(--input-bg); color: var(--text);
    border: 2px solid var(--border); border-radius: 10px;
    font-size: 14px; text-align: center; font-family: inherit;
    transition: border-color 0.3s;
  }
  .cn-login-bar input[type=text]:focus { outline: none; border-color: var(--accent); }

  /* Likert rows */
  .likert-row:hover { border-color: var(--accent) !important; background: rgba(181,56,54,0.06) !important; }

  /* Collapsible */
  .collapse-toggle {
    cursor: pointer; color: var(--accent); font-size: 12px;
    padding: 4px 0; display: inline-block; user-select: none;
  }
  .collapse-toggle:hover { text-decoration: underline; }
  .collapse-content { display: none; }
  .collapse-content.open { display: block; }

  /* === 移动端响应式 === */
  @media (max-width: 600px) {
    .container { padding: 6px !important; }
    .header h1 { font-size: 18px !important; }
    .header p { font-size: 12px !important; }
    body { font-size: 13px !important; }

    /* 所有2列→单列 */
    div[style*="1fr 1fr"] { grid-template-columns: 1fr !important; }
    div[style*="repeat(3, 1fr)"] { grid-template-columns: 1fr !important; }
    div[style*="repeat(2, 1fr)"] { grid-template-columns: 1fr !important; }
    div[style*="1fr auto 1fr"] { grid-template-columns: 1fr !important; gap: 6px !important; }

    /* Likert 左右文字 */
    div[style*="1fr auto 1fr"] > div:first-child,
    div[style*="1fr auto 1fr"] > div:last-child {
      font-size: 12px !important; text-align: center !important;
    }

    /* 圆点缩小 */
    #dotWrap { height: 50px !important; }
    #dotWrap > div > div {
      transform: scale(0.55); margin: 0 -3px;
    }

    /* 按钮 */
    .btn { font-size: 12px !important; padding: 10px 14px !important; width: 100% !important; }
    .btn-row { flex-direction: column !important; gap: 6px !important; }
    .btn-ai { width: 100% !important; padding: 12px !important; font-size: 14px !important; }

    /* 场景描述 */
    div[style*="font-size:14px"][style*="line-height:1.9"] { font-size: 12px !important; padding: 10px 12px !important; }

    /* 报告卡片 */
    .cn-card { padding: 14px 10px !important; }
    .cn-card h3 { font-size: 14px !important; }
    .cn-card p { font-size: 11px !important; }
    .char-card { padding: 10px 8px !important; }
    .room-card { padding: 12px 8px !important; }
    .dim-row { font-size: 10px !important; }

    /* 折叠区 */
    details { font-size: 11px !important; }
    details summary { padding: 8px 6px !important; }

    /* 输入框 */
    input[type="text"] { font-size: 14px !important; padding: 10px !important; }

    /* choice3 选项 */
    div[onclick*="selectAndNext"] { font-size: 12px !important; padding: 10px 12px !important; }

    /* 隐藏部分桌面装饰 */
    .beast-icon-large { font-size: 40px !important; }
  }

  /* ===== 博弈动画 ===== */
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 20px rgba(139,32,32,0.10); }
    50% { box-shadow: 0 0 40px rgba(181,56,54,0.2), 0 0 80px rgba(181,56,54,0.10); }
  }
  @keyframes float-up {
    0% { transform: translateY(0) scale(1); opacity: 0.6; }
    50% { transform: translateY(-40px) scale(1.1); opacity: 0.3; }
    100% { transform: translateY(-80px) scale(0.8); opacity: 0; }
  }
  @keyframes piece-breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes grid-fade {
    0% { opacity: 0.03; }
    50% { opacity: 0.08; }
    100% { opacity: 0.03; }
  }
  .hero-anim { animation: pulse-glow 3s ease-in-out infinite; }
  .float-particle { animation: float-up 4s ease-out infinite; position: absolute; pointer-events: none; }
  .piece-breathe { animation: piece-breathe 2.5s ease-in-out infinite; }
  .grid-bg { animation: grid-fade 4s ease-in-out infinite; }
  .beast-quad { cursor: pointer; transition: all 0.3s ease; overflow: hidden; }
  .beast-quad:hover { transform: translateY(-3px); }
  .beast-detail { max-height: 0; overflow: hidden; transition: max-height 0.5s ease; }
  .beast-detail.open { max-height: 600px; }
  .char-detail { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .char-detail.open { max-height: 400px; }

  /* ===== 弹窗 ===== */
  .modal-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s ease; }
  .modal-box { background:var(--card);border-radius:16px;padding:28px 24px;max-width:420px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.12); }
  .modal-box h3 { font-size:18px;color:var(--accent);margin-bottom:8px; }
  .modal-box p { font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:16px; }
  .modal-box input { width:100%;padding:12px 16px;background:var(--input-bg);color:var(--text);border:2px solid var(--border);border-radius:12px;font-size:15px;text-align:center;font-family:inherit;margin-bottom:16px; }
  .modal-box input:focus { outline:none;border-color:var(--accent); }

  /* ===== 圆点悬浮提示 ===== */
  .dot-wrap { position: relative; }
  .dot-wrap:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; font-size: 10px; font-weight: 600;

// ============================================================
// 评分引擎 v2 —— 分层加权 · 否定检测 · 结构分析 · 交叉一致性
// ============================================================

// 否定词检测：如果关键词前有否定词，不计分
function hasNegation(text, keyword) {
  const idx = text.indexOf(keyword);
  if (idx <= 0) return false;
  const prefix = text.substring(Math.max(0, idx - 6), idx);
  return /不|没|非|无|难以|不太|并不|从未/.test(prefix);
}

// 分层关键词评分：{strong: [权重3.0], weak: [权重1.2]}，放大信号
function kwScore(text, tieredKw) {
  let score = 0;
  (tieredKw.strong || []).forEach(k => {
    if (text.includes(k) && !hasNegation(text, k)) score += 3.0;
  });
  (tieredKw.weak || []).forEach(k => {
    if (text.includes(k) && !hasNegation(text, k)) score += 1.2;
  });
  return score;
}

// STAR结构检测（Situation-Task-Action-Result），反映回答质量
function detectSTAR(text) {
  let star = 0;
  if (/当时|之前|有一次|曾经|遇到过|面临/.test(text)) star += 1; // Situation
  if (/需要|必须|目标|任务是|要解决|要完成/.test(text)) star += 1; // Task
  if (/我做了|我决定|我选择|我采取|我提出|我主导|我推动/.test(text)) star += 1.5; // Action
  if (/结果|最终|后来|数据|增长|提升|降低|完成|达到/.test(text)) star += 1.5; // Result
  return star; // 0-5
}

function scoreStyleDimensions(scene, answer) {
  const t = answer || '';
  if (t.length < 15) return { 势: 5, 局: 5, 衡: 5, 法: 5 };

  const d = { 势: 5, 局: 5, 衡: 5, 法: 5 };
  const star = detectSTAR(t);

  // === 势：外势 vs 内势 ===
  const outerScore = kwScore(t, {
    strong: ['反问', '问他', '你呢', '你怎么看', '你什么', '互相交流', '主动交流'],
    weak: ['聊聊', '交个朋友', '认识一下', '打听', '顺便问', '交流', '互动', '分享', '沟通', '也想知道']
  });
  const innerScore = kwScore(t, {
    strong: ['保持距离', '没必要说', '不想多说', '含糊过去', '保守一点'],
    weak: ['没必要', '不用管', '随意', '无所谓', '礼貌', '应付', '简单说', '模糊', '懒得']
  });
  const qCount = (t.match(/[？?]/g) || []).length;
  const selfRef = (t.match(/我/g) || []).length;
  let 勢 = 5 + outerScore - innerScore;
  if (qCount >= 2) 勢 += 2;
  if (qCount >= 4) 勢 += 1.5;
  if (selfRef > 15) 勢 -= 1.5;
  if (star >= 3 && outerScore > innerScore) 勢 += 2;
  d.势 = Math.round(勢);

  // === 局：远局 vs 近局 ===
  const farScore = kwScore(t, {
    strong: ['长期规划', '职业方向', '成长路径', '战略意义', '未来发展', '长远来看', '深耕这个领域'],
    weak: ['长期', '未来', '方向', '规划', '发展', '成长', '目标', '理想', '前景', '潜力', '上升', '空间', '趋势', '赛道', '战略', '视野', '格局', '沉淀']
  });
  const nearScore = kwScore(t, {
    strong: ['工资待遇', '薪资水平', '离家近', '通勤方便', '眼下最重要', '实际到手'],
    weak: ['工资', '薪资', '待遇', '稳定', '眼前', '现在', '当前', '马上', '实际', '现实', '房租', '底薪', '福利', '年终', '方便']
  });
  let 局 = 5 + farScore - nearScore;
  if (/先.*再|首先.*然后|第一步.*第二步|短期.*长期/.test(t) && !hasNegation(t, '规划')) 局 += 2;
  if (star >= 4) 局 += 1.5;
  d.局 = Math.round(局);

  // === 衡：理衡 vs 情衡 ===
  const logicScore = kwScore(t, {
    strong: ['数据分析', '逻辑推理', 'ROI', '投入产出', '效率最优', '利弊权衡', '客观事实', '系统性'],
    weak: ['数据', '逻辑', '分析', '判断', '评估', '推理', '依据', '证据', '理性', '客观', '事实', '原因', '效率', '最优', '利弊', '性价比', '方案', '策略', '系统']
  });
  const feelScore = kwScore(t, {
    strong: ['感受很重要', '关系和谐', '人情世故', '照顾情绪', '团队融洽', '相互理解'],
    weak: ['感觉', '感受', '情绪', '氛围', '关系', '舒服', '在意', '照顾', '体谅', '共情', '信任', '喜欢', '合得来', '融洽', '合拍', '人情', '面子', '和谐']
  });
  let 衡 = 5 + logicScore - feelScore;
  if (star >= 3 && logicScore > feelScore) 衡 += 2;
  d.衡 = Math.round(衡);

  // === 法：活法 vs 定法 ===
  const flexScore = kwScore(t, {
    strong: ['随机应变', '看情况而定', '不设框架', '边走边看', '弹性处理', '灵活调整', '试错迭代'],
    weak: ['尝试', '探索', '不确定', '不一定', '看情况', '灵活', '调整', '变化', '改变', '变通', '可能', '也许', '或者', '再说', '试试看', '适应', '弹性']
  });
  const fixedScore = kwScore(t, {
    strong: ['按部就班', '稳扎稳打', '确定无疑', '长期坚持', '专注深耕', '步步为营', '有章法'],
    weak: ['确定', '稳定', '明确', '固定', '一定', '肯定', '坚持', '持续', '按计划', '流程', '规则', '制度', '框架', '标准', '规范', '稳妥', '踏实', '专注']
  });
  const sents = t.split(/[。！？.!?\n]+/).filter(s => s.trim());
  let 法 = 5 + flexScore - fixedScore;
  if (sents.length >= 3) {
    const ls = sents.map(s => s.length);
    const avg = ls.reduce((a, b) => a + b, 0) / ls.length;
    const vari = ls.reduce((s, l) => s + (l - avg) ** 2, 0) / ls.length;
    if (vari > 100) 法 += 2.5;
    if (vari < 20) 法 -= 2;
  }
  if (star >= 4 && flexScore > fixedScore) 法 += 2;
  d.法 = Math.round(法);

  // 场景权重
  d[scene.dims[0]] = Math.round(d[scene.dims[0]] * 1.3);
  if (scene.dims.length > 1) d[scene.dims[1]] = Math.round(d[scene.dims[1]] * 0.75);

  // 钳制 + 强力分散化
  Object.keys(d).forEach(k => {
    const raw = d[k];
    const dist = raw - 5;
    // 大幅放大离差，让分数分布拉开
    d[k] = Math.round(5 + dist * 1.8);
    d[k] = Math.max(1, Math.min(10, d[k]));
  });

  return d;
}

function scoreRadicalTightness(scene, answer) {
  const t = answer || '';
  const len = t.length;
  const star = detectSTAR(t);

  // 基础分：长度 + 结构质量
  let base = 3;
  if (len > 40) base = 4;
  if (len > 100) base = 5;
  if (len > 200) base = 6;
  if (len > 350) base = 7;
  base += star * 0.4; // STAR结构每项+0.4

  // 具体性：分层评分
  let spec = 0;
  const numCount = (t.match(/\d+/g) || []).length;
  if (numCount >= 2) spec += 1;
  if (numCount >= 5) spec += 0.5;
  if (/[0-9]+%|百分点|倍数|翻了|增长.*%|下降.*%/.test(t)) spec += 1.5;
  if (/[A-Z][a-z]+|[A-Z]{2,}/.test(t)) spec += 1; // 英文专有名词
  if (/公司|团队|项目|产品|系统|平台|业务|部门/.test(t)) spec += 1;
  if (/年|个月|周|季度|阶段|期/.test(t)) spec += 0.5;
  if (/[0-9]+万|[0-9]+亿|[0-9]+k|[0-9]+千/.test(t)) spec += 1; // 有量级

  // 深度：分层评分
  let depth = 0;
  if (/但是|不过|然而|后来才|回想起来|反思|复盘|总结|意识|领悟|学到了/.test(t)) depth += 2;
  if (/如果重来|假如再选|换一个角度|更深一层/.test(t)) depth += 2;
  if (/第一|第二|第三|首先|其次|最后|一方面|另一方面/.test(t)) depth += 1.5;
  if (/结果|最终|后来|于是|所以|因此|导致|带来/.test(t)) depth += 1;
  if (/因为.*所以|由于.*因此|基于.*决定/.test(t)) depth += 1; // 因果链

  // 真诚度（反向检测模板化/空洞回答）
  let sincerity = 0;
  if (/说实话|老实说|坦诚说|其实我也不知道|我承认|说真的/.test(t)) sincerity += 1.5;
  if (/我觉得|我认为|我倾向于|我的想法是/.test(t)) sincerity += 0.5;
  const templateKw = ['积极主动','认真负责','吃苦耐劳','团队合作','沟通能力强','学习能力强','抗压能力强'];
  let templateHits = 0;
  templateKw.forEach(k => { if (t.includes(k)) templateHits++; });
  sincerity -= templateHits * 1.5; // 模板词扣分

  const totalBase = Math.max(2, base + spec + depth + sincerity);
  const targets = scene.radicals;
  const allRads = ['厶','月','匕','厂','力','木','各','亡','王','目','言','寺'];
  const scores = {};

  // 分层关键词（strong=核心信号, weak=辅助信号）
  const kw = {
    '厶': {
      strong: ['独一无二', '只有我能', '我的独特', '别人做不了', '我的专长', '秘密武器'],
      weak: ['独特', '我自己的', '和别人不同', '我习惯', '我擅长', '特别', '专属']
    },
    '月': {
      strong: ['多年经验', '深耕了', '从业以来', '一直做这个', '积累了', '长期从事'],
      weak: ['多年', '几年', '一直', '长期', '经验', '积累', '持续', '经历']
    },
    '匕': {
      strong: ['最擅长的', '核心竞争力', '一击必中', '关键突破', '绝招', '杀手锏'],
      weak: ['关键', '核心', '突破', '最擅长', '最厉害', '精准', '一击']
    },
    '厂': {
      strong: ['大厂背景', '创业公司经历', '行业头部', '从零到一', '规模化阶段'],
      weak: ['公司', '企业', '大厂', '创业', '行业', '环境', '背景', '平台', '规模']
    },
    '力': {
      strong: ['主导了', '推动了', '完成了.*项目', '达成.*指标', '增长.*倍', '提升.*%'],
      weak: ['做到', '完成', '达成', '实现', '推动', '负责', '产出', '结果', '数据', '指标']
    },
    '木': {
      strong: ['我的性格就是', '天生就', '骨子里是', '底层逻辑', '本能的反应'],
      weak: ['性格', '风格', '人格', '特质', '倾向', '内在', '习惯', '天生']
    },
    '各': {
      strong: ['不走寻常路', '和别人不一样', '差异化路径', '非典型', '另辟蹊径'],
      weak: ['不同', '差异', '区别', '独特路径', '个性化', '非典型']
    },
    '亡': {
      strong: ['受不了了', '瓶颈了', '天花板到了', '没意思了', '厌倦了重复', '逃离'],
      weak: ['逃离', '离开', '不想', '瓶颈', '天花板', '没意思', '无聊', '重复']
    },
    '王': {
      strong: ['终极目标是', '理想状态是', '想成为.*的人', '梦想中的工作'],
      weak: ['理想', '终极', '最终', '梦想', '向往', '想成为', '最好的', '巅峰']
    },
    '目': {
      strong: ['行业趋势', '前瞻判断', '战略眼光', '全局视角', '洞察到'],
      weak: ['看到', '洞察', '视野', '预判', '判断', '趋势', '方向', '全局', '格局']
    },
    '言': {
      strong: ['谈判策略', '薪资协商', '展现价值', '包装经历', '议价能力'],
      weak: ['表达', '展示', '展现', '呈现', '包装', '谈判', '协商', '沟通']
    },
    '寺': {
      strong: ['按兵不动', '静观其变', '握在手里', '不急着亮牌', '沉住气'],
      weak: ['忍住', '不说', '等待', '保密', '持有', '握着', '藏着', '观察']
    }
  };

  allRads.forEach(r => {
    let s = totalBase;
    if (targets.includes(r)) s += 2;
    const k = kw[r] || { strong: [], weak: [] };
    let hits = 0;
    k.strong.forEach(w => { if (t.includes(w) && !hasNegation(t, w)) hits += 2; });
    k.weak.forEach(w => { if (t.includes(w) && !hasNegation(t, w)) hits += 0.7; });
    s += hits;
    // 钳制在1-10，加大离散
    s = Math.round(5 + (s - 5) * 1.2);
    scores[r] = Math.max(1, Math.min(10, s));
  });

  return scores;
}

// 程度题评分引擎 v3 —— Likert直接映射，多题交叉验证
// ============================================================

function scoreFromLikert(responses) {
  const dimScores = { 势:{sum:0,count:0}, 局:{sum:0,count:0}, 衡:{sum:0,count:0}, 法:{sum:0,count:0} };
  const radScores = {};

  responses.forEach((val, i) => {
    const q = S.selectedQuestions[i];
    const rawVal = Math.max(1, Math.min(7, val || 4));

    (q.dims || []).forEach(d => {
      const mapped = d.dir === -1 ? rawVal : (8 - rawVal);
      const sc7 = {1:1, 2:2.5, 3:4, 4:5.5, 5:7, 6:8.5, 7:10};
      dimScores[d.dim].sum += sc7[mapped] || 5.5;
      dimScores[d.dim].count += 1;
    });

    (q.rads || []).forEach(r => {
      if (!radScores[r.rad]) radScores[r.rad] = {sum:0, count:0};
      // 偏旁：距离中点法——坚定程度比方向更重要。|选4|=0→弱, |选1/7|=3→强
      const sc7 = {1:1, 2:2.5, 3:4, 4:5.5, 5:7, 6:8.5, 7:10};
      var distFromMid = Math.abs(rawVal - 4);
      var firmness = distFromMid + 4; // 4→4(中点), 1/7→7(最强)
      radScores[r.rad].sum += sc7[firmness] || 5.5;
      radScores[r.rad].count += 1;
    });
  });

  const fd = {};
  Object.keys(dimScores).forEach(k => {
    fd[k] = dimScores[k].count > 0 ? Math.round(dimScores[k].sum / dimScores[k].count) : 5;
    fd[k] = Math.max(1, Math.min(10, fd[k]));
  });

  const fr = {};
  const allRads = ['厶','月','匕','厂','力','木','各','亡','王','目','言','寺'];
  allRads.forEach(r => {
    if (radScores[r] && radScores[r].count > 0) fr[r] = Math.round(radScores[r].sum / radScores[r].count);
    else fr[r] = 5;
    fr[r] = Math.max(1, Math.min(10, fr[r]));
  });

  // 一致性验证：追问与基础回答对比——同向+同样坚定=牢固，反向或忽强忽弱=松动
  if (S.consistencyData) {
    allRads.forEach(function(r) {
      var cd = S.consistencyData[r];
      if (cd && cd.pairs && cd.pairs.length > 0) {
        var totalConsistency = 0;
        cd.pairs.forEach(function(pair) {
          var b = pair.base || 4, p = pair.probe || 4;
          // 方向一致性
          var bDir = b > 4 ? 1 : b < 4 ? -1 : 0;
          var pDir = p > 4 ? 1 : p < 4 ? -1 : 0;
          var sameDir = (bDir === pDir) || bDir === 0 || pDir === 0;
          // 坚定度一致性（都坚定或都中性 = 一致，一跳很坚定一跳中性 = 松）
          var bFirm = Math.abs(b-4), pFirm = Math.abs(p-4);
          var firmDiff = Math.abs(bFirm - pFirm);
          var firmConsistent = firmDiff <= 1;
          if (sameDir && firmConsistent) totalConsistency += 1.0;
          else if (sameDir) totalConsistency += 0.8;
          else totalConsistency += 0.5;
        });
        var avgConsistency = totalConsistency / cd.pairs.length;
        var factor = 0.8 + avgConsistency * 0.25; // range: 0.8~1.05
        fr[r] = Math.round(fr[r] * factor);
        fr[r] = Math.max(1, Math.min(10, fr[r]));
      }
    });
  }

  const style = classifyStyle(fd);
  if (style.势 === '外势') { fr['言']=Math.min(10,fr['言']+1); fr['力']=Math.min(10,fr['力']+1); fr['匕']=Math.min(10,fr['匕']+1); }
  else { fr['厶']=Math.min(10,fr['厶']+1); fr['木']=Math.min(10,fr['木']+1); fr['目']=Math.min(10,fr['目']+1); fr['寺']=Math.min(10,fr['寺']+1); }
  if (style.局 === '远局') { fr['目']=Math.min(10,fr['目']+1); fr['王']=Math.min(10,fr['王']+1); fr['木']=Math.min(10,fr['木']+1); }
  else { fr['力']=Math.min(10,fr['力']+1); fr['匕']=Math.min(10,fr['匕']+1); fr['厂']=Math.min(10,fr['厂']+1); }
  if (style.法 === '活法') { fr['各']=Math.min(10,fr['各']+1); fr['亡']=Math.min(10,fr['亡']+1); fr['寺']=Math.min(10,fr['寺']+1); fr['厶']=Math.max(1,fr['厶']-1); fr['厂']=Math.max(1,fr['厂']-1); }
  else { fr['厶']=Math.min(10,fr['厶']+1); fr['月']=Math.min(10,fr['月']+1); fr['厂']=Math.min(10,fr['厂']+1); fr['力']=Math.min(10,fr['力']+1); }

  Object.keys(fr).forEach(k => { fr[k] = Math.max(1, Math.min(10, fr[k])); });
  const typeDist = computeTypeDistribution(fd);
  return { finalDims: fd, finalRadicals: fr, style: typeDist.style, typeDist };
}
function classifyStyle(d) { return { 势: d.势 >= 6 ? '外势' : '内势', 局: d.局 >= 6 ? '远局' : '近局', 衡: d.衡 >= 6 ? '理衡' : '情衡', 法: d.法 >= 6 ? '活法' : '定法' }; }
function getStyleTypeName(s) { const m = { '外势_近局_理衡_定法': '压制型', '外势_近局_理衡_活法': '拆解型', '外势_近局_情衡_定法': '共鸣型', '外势_近局_情衡_活法': '适应型', '外势_远局_理衡_定法': '布局型', '外势_远局_理衡_活法': '演化型', '外势_远局_情衡_定法': '感召型', '外势_远局_情衡_活法': '渗透型', '内势_近局_理衡_定法': '深耕型', '内势_近局_理衡_活法': '解析型', '内势_近局_情衡_定法': '守护型', '内势_近局_情衡_活法': '直觉型', '内势_远局_理衡_定法': '孤局型', '内势_远局_理衡_活法': '深度型', '内势_远局_情衡_定法': '信念型', '内势_远局_情衡_活法': '流动型' }; return m[`${s.势}_${s.局}_${s.衡}_${s.法}`] || '未知型'; }

// 概率模型：S型曲线映射，让分数6-7产生70-80%的区分度
function dimProb(score) {
  const raw = Math.max(1, Math.min(10, score));
  // S型映射：中点=5.5，斜率0.7。分数4→74%,6→59%,8→85%。避免极端概率
  const midpoint = 5.5;
  const steepness = 0.7;
  const sigmoid = 1 / (1 + Math.exp(-steepness * (raw - midpoint)));
  const p2 = Math.round(sigmoid * 10000) / 100; const p1 = Math.round((100 - p2) * 100) / 100;
  return [p1, p2];
}

// 计算16种类型的概率分布
function computeTypeDistribution(fd) {
  const dims = ['势','局','衡','法'];
  const poles = [
    ['内势','外势'], ['近局','远局'], ['情衡','理衡'], ['定法','活法']
  ];
  const typeNames = {
    '内势_近局_情衡_定法':'守护型','内势_近局_情衡_活法':'直觉型',
    '内势_近局_理衡_定法':'深耕型','内势_近局_理衡_活法':'解析型',
    '内势_远局_情衡_定法':'信念型','内势_远局_情衡_活法':'流动型',
    '内势_远局_理衡_定法':'孤局型','内势_远局_理衡_活法':'深度型',
    '外势_近局_情衡_定法':'共鸣型','外势_近局_情衡_活法':'适应型',
    '外势_近局_理衡_定法':'压制型','外势_近局_理衡_活法':'拆解型',
    '外势_远局_情衡_定法':'感召型','外势_远局_情衡_活法':'渗透型',
    '外势_远局_理衡_定法':'布局型','外势_远局_理衡_活法':'演化型'
  };

  // 每个维度的概率（使用S型曲线）
  const dimProbs = dims.map((d, i) => {
    const score = fd[d];
    const [p1, p2] = dimProb(score);
    return { dim: d, pole1: poles[i][0], pole2: poles[i][1], p1, p2 };
  });

  // 计算16种类型的联合概率（独立假设）
  const typeProbs = [];
  Object.entries(typeNames).forEach(([key, name]) => {
    const parts = key.split('_');
    let prob = 1.0;
    dims.forEach((d, i) => {
      const pole = parts[i];
      const dp = dimProbs[i];
      prob *= (pole === dp.pole2) ? dp.p2 / 100 : dp.p1 / 100;
    });
    typeProbs.push({ key, name, prob: Math.round(prob * 10000) / 100 });
  });

  // 按概率降序排列
  typeProbs.sort((a, b) => b.prob - a.prob);

  // 归一化使总和=100（处理浮点误差）
  const total = typeProbs.reduce((s, t) => s + t.prob, 0);
  if (total > 0) typeProbs.forEach(t => { t.prob = Math.round(t.prob * 10000 / total) / 100; });

  // 确保总和不超100
  let running = 0;
  typeProbs.forEach((t, i) => {
    if (i < typeProbs.length - 1) { running += t.prob; }
    else { t.prob = Math.max(0, Math.round((100 - running) * 100) / 100); }
  });

  const topType = typeProbs[0];
  const top3 = typeProbs.slice(0, 3);
  const style = classifyStyle(fd);

  return { dimProbs, typeProbs, topType, top3, style };
}

// 个性化维度评价：基于 Likert 回答模式生成 MBTI 风格评估

  const highPole2 = dimQs.filter(q => q.dir === 1 && q.val >= 5).map(q => q.text);

  // 即：选了"比较同意/非常同意"反向题 = 实际倾向于 pole1

      : score >= 5

      ? '你在灵活应变和稳健持重之间可以自如切换。在业务面展示"能深耕"的一面，在高管面展示"能灵活应变"的一面——让每个房间看到你最适配的那个侧面。'

  } else if (score >= 5) {

  }

  return evalText;
}

function renderCharCard(cn,rs){const d=CHAR_DEFS[cn];const p=d.parts;const ov=Math.round(p.reduce((s,x)=>s+(rs[x]||5),0)/p.length);let h=`<div class="char-card"><div class="char-name">「${cn}」</div><div class="char-parts">${p.map(x=>'['+x+']'+RADICAL_DEFS[x].name).join(' · ')}</div><div style="font-size:11px;color:var(--sub);margin-bottom:8px;">${d.core}</div>`;p.forEach(x=>{const v=rs[x]||5;h+=`<div class="tightness-item"><span class="t-label">[${x}]</span><div class="t-bar"><div class="t-fill" style="width:${v*10}%;background:${getBarColor(v)}"></div></div><span class="t-val">${v}</span></div>`;});h+=`<div class="overall-tightness">整体松紧: ${ov}</div></div>`;return h;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

window.toggleBeast = function(idx){
  var detail = document.getElementById('beastDetail'+idx);
  if(!detail) return;
  var isOpen = detail.classList.contains('open');
  document.querySelectorAll('.beast-detail.open').forEach(function(el){ el.classList.remove('open'); });
  if(!isOpen){ detail.classList.add('open'); detail.scrollIntoView({behavior:'smooth',block:'nearest'}); }
};
// 六字展开/收起
window.toggleCharDetail = function(idx){
  var detail = document.getElementById('charDetail'+idx);
  if(!detail) return;
  var isOpen = detail.classList.contains('open');
  if(!isOpen){ detail.classList.add('open'); detail.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  else { detail.classList.remove('open'); }
};

var roomAlloc = { 'HR初筛':4, '业务面试':4, '交叉面试':4, '高管面试':4, 'HR谈薪':4 };
function renderRoomSliders(){
  var wrap = document.getElementById('roomSliders');
  if(!wrap) return;
  var rooms = ['HR初筛','业务面试','交叉面试','高管面试','HR谈薪'];
  var icons = {'HR初筛':'🔍','业务面试':'💼','交叉面试':'🤝','高管面试':'🏔️','HR谈薪':'⚖️'};
  var html = '';
  rooms.forEach(function(r){
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;">' +
      '<span style="width:18px;">'+icons[r]+'</span>' +
      '<span style="width:56px;color:var(--sub);">'+r+'</span>' +
      '<input type="range" min="2" max="9" value="'+roomAlloc[r]+'" ' +
        'oninput="updateAlloc(\''+r+'\',this.value)" ' +
        'style="flex:1;accent-color:var(--accent);">' +
      '<span style="width:24px;text-align:right;color:var(--accent);font-weight:600;" id="cnt_'+r+'">'+roomAlloc[r]+'</span>' +
      '</div>';
  });
  wrap.innerHTML = html;
}
function updateAlloc(room, val){
  roomAlloc[room] = parseInt(val);
  document.getElementById('cnt_'+room).textContent = val;
  var total = 0;
  Object.keys(roomAlloc).forEach(function(r){ total += roomAlloc[r]; });
  document.getElementById('totalQHint').textContent = '共 '+total+' 题';
}

function proceedToQuestions(){
  S._testStart = new Date();
  S.selectedQuestions = [];
  S._usedQIndices = {};
  var roomPools = {};
  QUESTION_BANK.forEach(function(q, qi){
    var room = q.room;
    if(!roomPools[room]) roomPools[room] = { core: [], rest: [] };
    if(q.stability || q.qType === 'choice3'){
      roomPools[room].core.push({q: q, idx: qi});
    } else {
      roomPools[room].rest.push({q: q, idx: qi});
    }
  });
  Object.keys(roomPools).forEach(function(room){
    var pool = roomPools[room];
    var alloc = roomAlloc[room] || 5;
    var coreSelected = pool.core.slice(0, alloc);
    coreSelected.forEach(function(item){
      S.selectedQuestions.push(item.q);
      S._usedQIndices[item.idx] = true;
    });
    var remaining = alloc - coreSelected.length;
    if(remaining > 0 && pool.rest.length > 0){
      for(var i = pool.rest.length-1; i>0; i--){
        var j = Math.floor(Math.random()*(i+1));
        var tmp = pool.rest[i]; pool.rest[i] = pool.rest[j]; pool.rest[j] = tmp;
      }
      var restSelected = pool.rest.slice(0, Math.min(remaining, pool.rest.length));
      restSelected.forEach(function(item){
        S.selectedQuestions.push(item.q);
        S._usedQIndices[item.idx] = true;
      });
    }
  });
  buildProbePairs();
  var roomOrder = ['HR初筛','业务面试','交叉面试','高管面试','HR谈薪'];
  S.selectedQuestions.sort(function(a,b){
    return roomOrder.indexOf(a.room) - roomOrder.indexOf(b.room);
  });
  S.answers = new Array(S.selectedQuestions.length).fill(0);
  S.consistencyData = {};
  S.dimScores=[]; S.radScores=[]; S.result=null; S.step=0; S.view='questions';
  S.mode = 'normal';
  render();
}

// 构建追问链：从未用题库中找同偏旁不同房间的题做追问，绝不重复
function buildProbePairs(){
  var newList = [];
  // 收集已用题索引
  var usedQIndices = S._usedQIndices || {};
  // 只选部分基题配追问（隔2道配1道）
  for(var i = 0; i < S.selectedQuestions.length; i++){
    var base = S.selectedQuestions[i];
    newList.push(base);
    if(i % 3 !== 0) continue; // 隔2道配1道

    var baseRads = (base.rads || []).map(function(r){return r.rad;});
    // 从完整题库中找未用过的追问（不同房间，同偏旁）
    for(var qi = 0; qi < QUESTION_BANK.length; qi++){
      if(usedQIndices[qi]) continue;
      var cand = QUESTION_BANK[qi];
      if(cand.room === base.room) continue; // 不同房间
      var candRads = (cand.rads || []).map(function(r){return r.rad;});
      var shared = baseRads.filter(function(r){return candRads.indexOf(r) >= 0;});
      if(shared.length > 0){
        var probeQ = Object.assign({}, cand); // 浅拷贝，避免修改原题
        probeQ._isProbe = true;
        probeQ._probeRad = shared[0];
        probeQ._baseIdx = newList.length - 1;
        usedQIndices[qi] = true;
        newList.push(probeQ);
        break;
      }
    }
  }
  S.selectedQuestions = newList;
  S._usedQIndices = usedQIndices;
}

function selectAndNext(val) {
  S.answers[S.step] = val;
  var q = S.selectedQuestions[S.step];
  // 追问一致性追踪
  if (q._isProbe && q._probeRad) {
    var rad = q._probeRad;
    var baseIdx = q._baseIdx;
    var baseAns = S.answers[baseIdx] || 0;
    if (!S.consistencyData[rad]) S.consistencyData[rad] = { pairs: [] };
    S.consistencyData[rad].pairs.push({ base: baseAns, probe: val });
  }
  for (var v = 1; v <= 7; v++) {
    var el = document.getElementById('dot'+v);
    if (!el) continue;
    var r = 10 + Math.abs(v-4) * 6;
    var sel = v === val;
    var sz = sel ? r+5 : r;
    el.style.width = (sz*2)+'px'; el.style.height = (sz*2)+'px';
    el.style.background = sel ? 'var(--accent)' : 'rgba(226,176,74,' + (0.05 + Math.abs(v-4)*0.09) + ')';
    el.style.border = '2px solid ' + (sel ? 'var(--accent)' : 'rgba(226,176,74,' + (0.10 + Math.abs(v-4)*0.15) + ')');
    el.style.boxShadow = sel ? '0 0 14px rgba(181,56,54,0.25)' : 'none';
  }
  setTimeout(function() {
    var total = S.selectedQuestions.length;
    // 中点检查：~50%进度时，检测极端松紧并动态插入追问
    var midPoint = Math.floor(total * 0.45);
    if (S.step === midPoint && !S._midChecked) {
      S._midChecked = true;
      checkAndInsertProbes();
      total = S.selectedQuestions.length; // 可能有新增
    }
    if (S.step < total - 1) { S.step++; render(); }
    else { S.view='analyzing';render();setTimeout(function(){S.result=scoreFromLikert(S.answers);saveSession();S.view='report';render();},600); }
  }, 280);
}

// 中点检查：极端松紧 + 维度矛盾 → 动态插入追问
function checkAndInsertProbes(){
  // === 1) 维度矛盾检测：均分和中位数差距大 → 该维需要更多验证
  var dimList = {势:{raw:[]},局:{raw:[]},衡:{raw:[]},法:{raw:[]}};
  for(var i = 0; i <= S.step; i++){
    var q = S.selectedQuestions[i];
    if(!q || q._isProbe) continue;
    (q.dims||[]).forEach(function(d, di){
      var rawVal = Math.max(1, Math.min(7, S.answers[i]||4));
      var mapped = d.dir===-1 ? rawVal : (8-rawVal);
      var sc7 = {1:1,2:2.5,3:4,4:5.5,5:7,6:8.5,7:10};
      dimList[d.dim].raw.push(sc7[mapped]||5.5);
    });
  }
  var contradictoryDims = [];
  Object.keys(dimList).forEach(function(dim){
    var raw = dimList[dim].raw;
    if(raw.length < 3) return;
    raw.sort(function(a,b){return a-b;});
    var mid = Math.floor(raw.length/2);
    var median = raw.length%2===1 ? raw[mid] : (raw[mid-1]+raw[mid])/2;
    var mean = raw.reduce(function(a,b){return a+b;},0)/raw.length;
    if(Math.abs(mean-median) > 1.5) contradictoryDims.push(dim);
  });

  // === 2) 极端松紧检测 ===
  var radCounts = {}; var radSums = {};
  for(var i = 0; i <= S.step; i++){
    var q = S.selectedQuestions[i];
    if(!q || q._isProbe) continue;
    (q.rads||[]).forEach(function(r){
      if(!radCounts[r.rad]){ radCounts[r.rad]=0; radSums[r.rad]=0; }
      radCounts[r.rad]++; radSums[r.rad] += (S.answers[i]||4);
    });
  }
  var extremeRads = [];
  Object.keys(radCounts).forEach(function(rad){
    if(radCounts[rad] < 2) return;
    var avg = radSums[rad]/radCounts[rad];
    // 极端高(≥6)或极端低(≤2) → 需要更多验证
    if(avg >= 6 || avg <= 2) extremeRads.push(rad);
  });
  // 合并极端偏旁和矛盾维度，优先矛盾维度
  var probeTargets = contradictoryDims.concat(extremeRads);
  if(probeTargets.length === 0) return;
  if(!S._usedQIndices) S._usedQIndices = {};
  var insertCount = 0;
  for(var ri = 0; ri < probeTargets.length && insertCount < 3; ri++){
    var target = probeTargets[ri];
    var isDim = contradictoryDims.indexOf(target) >= 0;
    for(var qi = 0; qi < QUESTION_BANK.length; qi++){
      if(S._usedQIndices[qi]) continue;
      var cand = QUESTION_BANK[qi];
      var match = false;
      if(isDim){
        // 找测试该dim的题
        match = (cand.dims||[]).some(function(d){return d.dim === target;});
      } else {
        // 找测试该rad的题
        match = (cand.rads||[]).some(function(r){return r.rad === target;});
      }
      if(match){
        var probeQ = Object.assign({}, cand);
        probeQ._isProbe = true;
        if(!isDim) probeQ._probeRad = target;
        S.selectedQuestions.splice(S.step + 1 + insertCount, 0, probeQ);
        S.answers.splice(S.step + 1 + insertCount, 0, 0);
        S._usedQIndices[qi] = true;
        insertCount++;
        break;
      }
    }
  }
  // 追问插入后对剩余题目按房间重新排序，保持房间连续性
  if(insertCount > 0){
    var roomOrder = ['HR初筛','业务面试','交叉面试','高管面试','HR谈薪'];
    var head = S.selectedQuestions.slice(0, S.step + 1);
    var tail = S.selectedQuestions.slice(S.step + 1);
    var tailAnswers = S.answers.slice(S.step + 1);
    // 对尾部按房间排序
    var indexed = tail.map(function(q, i){ return {q: q, a: tailAnswers[i]}; });
    indexed.sort(function(a, b){ return roomOrder.indexOf(a.q.room) - roomOrder.indexOf(b.q.room); });
    S.selectedQuestions = head.concat(indexed.map(function(x){ return x.q; }));
    S.answers = head.map(function(_, i){ return S.answers[i]; }).concat(indexed.map(function(x){ return x.a; }));
  }
}

function nextQ(){

    console.error(e);
  }
}

// 能力盘整体评价
function overallCharAssessment(rads) {
  const chars = [
    { name: '能', parts: ['厶','月','匕'] },
    { name: '历', parts: ['厂','力'] },
    { name: '格', parts: ['木','各'] },
    { name: '望', parts: ['亡','月','王'] },
    { name: '相', parts: ['木','目'] },
    { name: '詩', parts: ['言','寺'] }
  ];
  const scores = chars.map(c => ({
    ...c,
    avg: Math.round(c.parts.reduce((s, p) => s + (rads[p] || 5), 0) / c.parts.length * 10) / 10,
    min: Math.min(...c.parts.map(p => rads[p] || 5)),
    max: Math.max(...c.parts.map(p => rads[p] || 5))
  }));
  const overallAvg = Math.round(scores.reduce((s, c) => s + c.avg, 0) / scores.length * 10) / 10;
  const strongChars = scores.filter(c => c.avg >= 7).map(c => c.name);
  const weakChars = scores.filter(c => c.avg <= 4).map(c => c.name);
  const balanced = scores.filter(c => c.max - c.min >= 5).map(c => c.name); // 偏旁差距大

  let summary = '';
  if (overallAvg >= 7) summary = '你的能力盘整体牢固，六个字的核心偏旁都有较好的证据支撑。面试中你有充足的操作空间——重点不是"防守"，而是主动用强势字引导面试官的评价方向。';
  else if (overallAvg >= 5) summary = '你的能力盘处于中等水平，有明确的强势字也有薄弱环节。面试策略应该是"以强字开路，以弱字防守"——主动展示强势字所在的能力，同时对薄弱偏旁做好防御准备。';
  else summary = '你的能力盘整体偏松，多个字的核心偏旁缺乏足够的证据支撑。在进入面试之前，建议针对薄弱偏旁准备2-3个具体的STAR案例。这不是"你不行"——而是"你还没把行的地方说清楚"。';

  return { scores, overallAvg, strongChars, weakChars, balanced, summary };
}

// 战术×能力盘交叉分析
function crossAnalysis(style, rads, charAssess) {

    insights.push('远局战术+强[目]（视野判断）——这是高管面最理想的组合。你有能力在对话中自然切换到行业判断和未来趋势的讨论层面，这是大多数候选人做不到的。在高管面中主动抛出你对行业的一个判断。');
  }
  // 近局+强[力] → 业务面优势
  if (style.局 === '近局' && rads['力'] >= 7) {

  }
  // 活法+弱[亡] → 选择太多反而犹豫
  if (style.法 === '活法' && rads['亡'] <= 4) {
    insights.push('活法让你保持开放，但弱[亡]（逃离意识）意味着你对自己要逃离什么还不够清晰。面试中对方问到"为什么看机会"时，你的回答可能缺少方向感。建议在面试前把这题的答案写下来，确保它听起来像"在追"而非"在飘"。');
  }
  // 定法+强[厂][力] → 可靠感
  if (style.法 === '定法' && rads['厂'] >= 7 && rads['力'] >= 7) {
    insights.push('定法战术+强[厂]强[力]——你给人"靠谱、能成事"的感觉，这在HR面和业务面都是强势信号。你的策略不是展示多样性，而是展示"在这个方向上我是最可靠的"。');
  }
  // 理衡+强[目][厶] → 技术深度型
  if (style.衡 === '理衡' && rads['目'] >= 7 && rads['厶'] >= 7) {
    insights.push('理衡战术+强[目]强[厶]——你是一个"深度思考者"。在面试中你最强的牌是展示你对问题的拆解能力和独特洞察，而不是展示你做过了多少件事。');
  }
  // 情衡+强[各] → 人际关系优势
  if (style.衡 === '情衡' && rads['各'] >= 7) {
    insights.push('情衡战术+强[各]（差异化表现）——你善于在人际关系中找到自己的独特位置。交叉面是你的优势房间，因为你天然擅长"让人舒服地接受你的与众不同"。');
  }

  // 多维思维评估：choice3题型中选C（最开放/多维的选项）的频率
  var multiDimCount = 0, choice3Total = 0;
  S.selectedQuestions.forEach(function(q, i){
    if(q.qType === 'choice3' && S.answers[i]){
      choice3Total++;
      if(S.answers[i] >= 5) multiDimCount++; // C选项映射到6
    }
  });
  if(choice3Total >= 2){
    var multiRatio = multiDimCount / choice3Total;
    if(multiRatio >= 0.6){
      insights.push('🧠 你在场景选择题中倾向多维/开放的思考路径——不急于锁定一个答案，而是先审视问题本身的前提。这种思维在交叉面和高管面是真正的优势：面试官想看到的就是你"想问题的过程"而非"答题的速度"。');
    } else if(multiRatio >= 0.3){
      insights.push('🧠 你在场景选择题中会根据情况切换思维模式——有的题走直答路径，有的题会跳出框架重新审视前提。这种灵活性是好的，但可以更主动地在关键问题上使用多维视角。');
    } else {
      insights.push('🧠 你在场景选择题中倾向单维/直接的思考路径——快速锁定答案并给出行动方案。这种效率型思维在业务面是加分项，但在需要展现思考深度的时候（高管面），可以试试先质疑问题本身，再给出判断。');
    }
  }

  // 稳定性/Gap评估：双向追问能力
  var stabAnswers = [];
  S.selectedQuestions.forEach(function(q, i){
    if(q.stability && S.answers[i]) stabAnswers.push(S.answers[i]);
  });
  if(stabAnswers.length >= 2){
    var avgStab = stabAnswers.reduce(function(a,b){return a+b;},0)/stabAnswers.length;
    if(avgStab >= 5.5){
      insights.push('🔁 面对稳定性质疑时，你倾向「追问式回答」——不急于辩解，而是把单向质疑转化为双向讨论。这种风格在HR面和谈薪面是巨大的优势：你不是在求对方信任你，而是在和对方一起评估匹配度。');
    } else if(avgStab >= 3.5){
      insights.push('🔁 面对稳定性质疑时，你有时会进入「防御模式」——直接解释事实但忽略了对方的真实关切。建议在被问到gap/跳槽等问题时，先反问一句对方的期望，把辩解题变成匹配题。');
    } else {
      insights.push('🔁 面对稳定性质疑时，你倾向直接解释客观原因——这样回答本身没有问题，但容易让对话变成"你在证自己"。试试在被问到稳定性时反问一句"你希望这个岗位的人具备什么特质"，把单向压力变成双向沟通。');
    }
  }

  if (insights.length === 0) {
    insights.push('你的战术人格和偏旁组合较为均衡，没有明显的"天赋区间"也没有结构性短板。在面试中保持自然发挥即可，各房间通用策略是：展示你最牢固的3个偏旁，避免暴露最薄弱的2个偏旁。');
  }

  return insights;
}

// 稳定性评估：判断用户面对gap质疑时的策略模式
function stabilityEval(){
  var stabQs = []; var stabAs = [];
  S.selectedQuestions.forEach(function(q,i){
    if(q.stability && S.answers[i]){ stabQs.push(q); stabAs.push(S.answers[i]); }
  });
  if(stabQs.length === 0) return null;
  var avg = stabAs.reduce(function(a,b){return a+b;},0)/stabAs.length;
  var style = avg >= 5.5 ? '追问框架' : avg >= 3.5 ? '混合策略' : '直答框架';
  var desc = avg >= 5.5
    ? '你把稳定性问题当成双向匹配的入口——不急于证明自己，而是用追问把对方拉进对话。这不是"回避问题"，而是把面试从审讯变成谈判。'
    : avg >= 3.5
    ? '你在直接回应和双向追问之间切换——有时能跳出防御模式，有时还是会习惯性解释。多练几次追问的节奏感，就能更自然地用这个技巧。'
    : '你面对质疑时更习惯直接解释事实——这种风格真诚但被动。试试在被问到gap/频繁跳槽时先说"我理解你的担心，不过我也想了解..."，把防守变成对话。';
  return { style: style, avg: avg.toFixed(1), desc: desc };
}

        break;
      case 'HR谈薪':
        if (rads['言'] >= 7) room.tips.push('强[言]偏旁——你在谈判中有足够的表达能力。准备好在"锚定"环节主动报价（而不是被动回应对方的数字）。');
        if (rads['寺'] >= 7) room.tips.push('强[寺]偏旁——你知道什么时候该说、什么时候该沉默。谈判中"先开口的人输"——你能沉住气，这是很大的优势。');
        if (rads['言'] <= 4 && rads['寺'] <= 4) room.tips.push('[言]和[寺]双双偏弱——谈判是你的薄弱环节。至少准备两个要点：1）你期望的数字和理由，2）薪资之外你可以谈的其他维度（职级、项目、弹性工作等）。');
        if (style.法 === '活法') room.tips.push('活法战术——谈判中不要把焦点只放在薪资上。你的优势在于灵活重组：职级、签字费、试用期、第一年项目分配——这些都可以谈出一个"总价值"更高的包。');
        break;
    }
    // 通用补白
    if (room.tips.length === 0) {
      room.tips.push('在这个房间中自然发挥即可，没有明显的风险点需要特别关注。');
    }
  });

  return rooms;
}

// 按房间计算：场景风格评价 + 能力掌控度 + 六字评分拆解
function computeRoomScores(selectedQuestions, answers, finalRadicals, finalDims, style) {
  var rooms = ['HR初筛','业务面试','交叉面试','高管面试','HR谈薪'];
  var chars = [
    { name:'能', parts:['厶','月','匕'], core:'你能做什么' },
    { name:'历', parts:['厂','力'], core:'你做过什么' },
    { name:'格', parts:['木','各'], core:'你是什么样的人' },
    { name:'望', parts:['亡','月','王'], core:'你想要什么' },
    { name:'相', parts:['木','目'], core:'你有多合适' },
    { name:'詩', parts:['言','寺'], core:'你怎么讲故事' }
  ];

  // 房间信息映射
  var roomMeta = {
    'HR初筛': { focus:'主要看你是不是靠谱、表达是否清晰', coreCap:'[詩]表达叙事 · [格]人格呈现', risk:'过度包装或过度坦诚', icon:'🔍' },
    '业务面试': { focus:'深挖你的专业能力和项目经验', coreCap:'[能]硬实力 · [历]战绩履历', risk:'经验叙述空洞或逻辑断裂', icon:'💼' },
    '交叉面试': { focus:'看你和团队合不合得来、协作风格如何', coreCap:'[格]人格匹配 · [相]文化适配', risk:'过于自我或过于迎合', icon:'🤝' },
    '高管面试': { focus:'老板看你的格局和长期价值判断', coreCap:'[望]求职动机 · [目]视野判断', risk:'格局不够或被看穿动机', icon:'🏔️' },
    'HR谈薪': { focus:'就是谈钱——看谁信息多、谁会谈判', coreCap:'[詩]叙事筹码 · [寺]节奏把控', risk:'底线暴露或僵持不下', icon:'⚖️' }
  };

  var roomData = [];
  rooms.forEach(function(room) {
    var meta = roomMeta[room] || { focus:'', coreCap:'', risk:'', icon:'🏠' };
    // 收集该房间的题目和回答
    var roomQs = [];
    selectedQuestions.forEach(function(q, i) {
      if (q.room === room) roomQs.push({ q: q, a: answers[i] || 4 });
    });
    if (roomQs.length === 0) return;

    // === 1) 场景风格评价：加权+中位数交叉验证 ===
    var roomDimScores = {
      势:{weightedSum:0,weightCount:0,rawList:[]},
      局:{weightedSum:0,weightCount:0,rawList:[]},
      衡:{weightedSum:0,weightCount:0,rawList:[]},
      法:{weightedSum:0,weightCount:0,rawList:[]}
    };
    var sc7 = {1:1, 2:2.5, 3:4, 4:5.5, 5:7, 6:8.5, 7:10};
    roomQs.forEach(function(rq) {
      (rq.q.dims || []).forEach(function(d, di) {
        var rawVal = Math.max(1, Math.min(7, rq.a || 4));
        var mapped = d.dir === -1 ? rawVal : (8 - rawVal);
        var score = sc7[mapped] || 5.5;
        // 第一位dim权重1.5(该题主要测此维), 其余1.0
        var w = di === 0 ? 1.5 : 1.0;
        roomDimScores[d.dim].weightedSum += score * w;
        roomDimScores[d.dim].weightCount += w;
        roomDimScores[d.dim].rawList.push(score);
      });
    });
    // 每个dim计算加权均分 + 中位数 + 一致性
    var dimEvidence = {}; // 记录证据链
    ['势','局','衡','法'].forEach(function(dim){
      var ds = roomDimScores[dim];
      if(ds.rawList.length === 0){ dimEvidence[dim] = null; return; }
      var weightedAvg = ds.weightCount > 0 ? ds.weightedSum / ds.weightCount : 5.5;
      var sorted = ds.rawList.slice().sort(function(a,b){return a-b;});
      var mid = Math.floor(sorted.length/2);
      var median = sorted.length%2===1 ? sorted[mid] : (sorted[mid-1]+sorted[mid])/2;
      var divergence = Math.abs(weightedAvg - median);
      var consistent = divergence <= 1.5;
      dimEvidence[dim] = {
        weightedAvg: Math.round(weightedAvg*10)/10,
        median: Math.round(median*10)/10,
        divergence: Math.round(divergence*10)/10,
        consistent: consistent,
        signals: ds.rawList.length,
        rawList: ds.rawList
      };
    });
    // 场景风格标签（基于加权均分，而非一刀切）
    var roomStyle = {};
    var refStyle = style;
    var roomScore10 = {};
    var shiftThreshold = 0.5;
    ['势','局','衡','法'].forEach(function(dim) {
      var ev = dimEvidence[dim];
      var score = ev ? ev.weightedAvg : 5.5;
      // 考虑中位数修正：如果中位数和均分矛盾，取中位数（更稳健）
      if(ev && !ev.consistent && ev.signals >= 3) score = ev.median;
      roomScore10[dim] = score;
      roomStyle[dim] = score >= 6 ? (dim==='势'?'外势':dim==='局'?'远局':dim==='衡'?'理衡':'活法')
                     : (dim==='势'?'内势':dim==='局'?'近局':dim==='衡'?'情衡':'定法');
    });
    // 四象偏移检测
    var roomBeastKey = roomStyle['势'] + '_' + roomStyle['局'];
    var overallBeastKey = refStyle['势'] + '_' + refStyle['局'];
    var beastShiftText = '';
    var shiLabelDiff = roomStyle['势'] !== refStyle['势'];
    var juLabelDiff = roomStyle['局'] !== refStyle['局'];
    var shiNumDiff = Math.abs(roomScore10['势'] - finalDims['势']);
    var juNumDiff = Math.abs(roomScore10['局'] - finalDims['局']);
    if (!shiLabelDiff && !juLabelDiff) {
      var diffParts = [];
      if (shiNumDiff >= shiftThreshold) diffParts.push('势差' + (roomScore10['势']-finalDims['势']>=0?'+':'') + (roomScore10['势']-finalDims['势']).toFixed(1));
      if (juNumDiff >= shiftThreshold) diffParts.push('局差' + (roomScore10['局']-finalDims['局']>=0?'+':'') + (roomScore10['局']-finalDims['局']).toFixed(1));
      beastShiftText = diffParts.length > 0
        ? '与本命战术同属一个象限，但' + diffParts.join('，') + '——数值波动未改变整体攻守格局'
        : '与本命战术同属一个象限，攻守策略在此房间中自然延展';
    } else if ((shiLabelDiff && shiNumDiff < shiftThreshold) && (juLabelDiff && juNumDiff < shiftThreshold)) {
      beastShiftText = '四象标签有差异但数值接近——策略未发生实质偏移，自然发挥即可';
    } else {
      var beastMap = { '外势_远局':'青龙', '外势_近局':'白虎', '内势_远局':'朱雀', '内势_近局':'玄武' };
      var overallBeast = beastMap[overallBeastKey] || overallBeastKey;
      var roomBeast = beastMap[roomBeastKey] || roomBeastKey;
      beastShiftText = '策略从<strong>' + overallBeast + '系</strong>（' + refStyle['势'] + '×' + refStyle['局'] + '）向<strong>' + roomBeast + '系</strong>（' + roomStyle['势'] + '×' + roomStyle['局'] + '）偏移——本房间的场景特性让你调整了攻守姿态';
    }
    // 场景风格适配度评价
    var sceneStyleLabel = '';
    var idealStyles = {
      'HR初筛':  { 势:'外势', 局:'近局', note:'HR主要看靠谱度和表达力——直接说清你能做什么、做过什么就行' },
      '业务面试': { 势:'内势', 局:'近局', note:'直属leader看重专业深度和落地能力——用数据说话，用案例验证' },
      '交叉面试': { 势:'外势', 局:'近局', note:'跨部门同事看你合不合得来——坦诚直接比完美包装更重要' },
      '高管面试': { 势:'内势', 局:'远局', note:'高管看格局和长期判断——不只讲做过什么，更要讲为什么做' },
      'HR谈薪':   { 势:'外势', 局:'远局', note:'谈判就是信息战——谁手里的牌多、谁能沉住气，谁就赢' }
    };
    var ideal = idealStyles[room];
    var matchCount = 0;
    if (ideal) {
      if (roomStyle['势'] === ideal['势']) matchCount++;
      if (roomStyle['局'] === ideal['局']) matchCount++;
    }
    if (matchCount >= 2) sceneStyleLabel = '✅ 本房间场景风格与最佳策略高度一致，自然发挥即可';
    else if (matchCount >= 1) sceneStyleLabel = '⚡ 与最佳策略部分一致——注意调整' + (roomStyle['势']!==ideal['势']?'「势」':'「局」') + '维度展示方式';
    else sceneStyleLabel = '⚠️ 与最佳策略存在偏差，建议重新审视此房间的表达方式';

    // === 2) 能力掌控度：该房间各偏旁松紧度（统一用 sc7 映射到 1-10 标尺）===
    var radScores = {};
    roomQs.forEach(function(rq) {
      (rq.q.rads || []).forEach(function(r) {
        var rawVal = Math.max(1, Math.min(7, rq.a || 4));
        // 偏旁：距离中点法——坚定=松，犹豫=紧
        var distFromMid = Math.abs(rawVal - 4);
        var firmness = distFromMid + 4;
        if (!radScores[r.rad]) radScores[r.rad] = { sum: 0, count: 0 };
        radScores[r.rad].sum += (sc7[firmness] || 5.5);
        radScores[r.rad].count += 1;
      });
    });
    // 汇总该房间涉及的所有偏旁及其松紧度（均为 1-10 标尺）
    var radTightnessList = [];
    Object.keys(radScores).forEach(function(rad) {
      var avg10 = Math.round(radScores[rad].sum / radScores[rad].count * 10) / 10;
      var globalAvg = finalRadicals[rad] || 5;
      var gap = Math.round((avg10 - globalAvg) * 10) / 10;
      radTightnessList.push({ rad: rad, name: RADICAL_DEFS[rad] ? RADICAL_DEFS[rad].name : rad, roomVal: avg10, globalVal: globalAvg, gap: gap });
    });
    radTightnessList.sort(function(a, b) { return a.roomVal - b.roomVal; });
    var weakRads = radTightnessList.filter(function(r) { return r.roomVal <= 4; });
    var strongRads = radTightnessList.filter(function(r) { return r.roomVal >= 8; });

    var controlSummary = '';
    if (weakRads.length === 0) controlSummary = '所有偏旁都处于可控状态，没有明显防御盲区';
    else if (weakRads.length <= 2) controlSummary = '有' + weakRads.length + '个薄弱偏旁（' + weakRads.map(function(r){return '['+r.rad+']'+r.name;}).join('、') + '）——面试官可能从这些点切入追问';
    else controlSummary = '有' + weakRads.length + '个薄弱偏旁，防御面较宽——建议针对最弱的两个偏旁准备补充案例';

    // === 3) 六字评分 + 房间综合分 ===
    // 风格契合度：你的本命四象 vs 房间理想四象
    var dimMatch = 0;
    if (roomStyle['势'] === ideal['势']) dimMatch++;
    if (roomStyle['局'] === ideal['局']) dimMatch++;
    // 风格契合：主场不加成但标注，客场不重罚——用户应聚焦主场而非纠结客场
    var styleMatch = dimMatch >= 2 ? 1.05 : dimMatch >= 1 ? 1.0 : 0.9;
    var matchLabel = dimMatch >= 2 ? '主场' : dimMatch >= 1 ? '中性' : '客场';

    // 每个字：松紧度即得分（1-10），干净直观
    var charScores = chars.map(function(c) {
      var tightSum = 0, tightCount = 0;
      c.parts.forEach(function(p) {
        if (radScores[p]) {
          tightSum += radScores[p].sum / radScores[p].count;
          tightCount += 1;
        }
      });
      var roomTightness10 = tightCount > 0 ? Math.min(10, Math.max(1, Math.round(tightSum / tightCount * 10) / 10)) : 5;
      // 该房间是否重点考察此字
      var isKey = false;
      if (room === 'HR初筛' && (c.name === '詩' || c.name === '格')) isKey = true;
      if (room === '业务面试' && (c.name === '能' || c.name === '历')) isKey = true;
      if (room === '交叉面试' && (c.name === '格')) isKey = true;
      if (room === '高管面试' && (c.name === '望' || c.name === '相')) isKey = true;
      if (room === 'HR谈薪' && (c.name === '詩')) isKey = true;
      return { name: c.name, score: roomTightness10, isKey: isKey, core: c.core, parts: c.parts };
    });

    // 房间综合分 = 加权均分（重点字权重1.5，常规字1.0）× 风格契合
    var weightedSum = 0, weightTotal = 0;
    charScores.forEach(function(c) {
      // 重点字权重高，常规字仅作参考（不触发严重问题则忽略）
      var w = c.isKey ? 2.0 : 0.3;
      weightedSum += c.score * w;
      weightTotal += w;
    });
    var roomAvg = Math.min(10, Math.round(weightedSum / weightTotal * 10) / 10);
    var roomFinal = Math.min(10, Math.round(roomAvg * styleMatch * 10) / 10);

    // 找出最弱字和最强字（仅在重点字中排序，常规字除非极弱否则忽略）
    var sortedChars = charScores.slice().sort(function(a, b) { return a.score - b.score; });
    var weakest = sortedChars[0];
    var strongest = sortedChars[sortedChars.length - 1];

    // 扣分原因 + 战术改进：聚焦重点字
    var deductions = [];
    var tactics = [];
    // 重点字中最低分
    var keyChars = charScores.filter(function(c) { return c.isKey; });
    var weakKeys = keyChars.filter(function(c) { return c.score < 6; });
    if (weakKeys.length > 0) {
      weakKeys.sort(function(a, b) { return a.score - b.score; });
      deductions.push('重点字' + weakKeys.map(function(c){return '「'+c.name+'」';}).join('、') + '偏弱——本房间面试官会重点考察这些能力');
      weakKeys.forEach(function(wk) {
        if (wk.score < 5) tactics.push('「' + wk.name + '」(' + wk.core + ')仅' + wk.score.toFixed(1) + '分——准备2-3个针对' + room + '场景的STAR案例');
      });
    }
    // 常规字仅当极弱(≤3)才提醒
    var regChars = charScores.filter(function(c) { return !c.isKey; });
    var criticalReg = regChars.filter(function(c) { return c.score <= 3; });
    if (criticalReg.length > 0 && weakKeys.length === 0) {
      deductions.push('常规字' + criticalReg.map(function(c){return '「'+c.name+'」';}).join('、') + '出现严重短板');
    }
    // 强势重点字
    var strongKeys = keyChars.filter(function(c) { return c.score >= 7.5; });
    if (strongKeys.length > 0) {
      tactics.push('本房间强势重点字：' + strongKeys.map(function(c){return '「'+c.name+'」('+c.score.toFixed(1)+')';}).join('、') + '——主动以此开路，掌握对话主动权');
    }

    // === 偏旁脱落与重组（能力掌控）===
    var shedRads = weakRads.map(function(r){return r.rad;});
    var recombineTips = [];
    chars.forEach(function(c) {
      var weakParts = c.parts.filter(function(p){return shedRads.indexOf(p) >= 0;});
      var strongParts = c.parts.filter(function(p){return shedRads.indexOf(p) < 0;});
      if (weakParts.length > 0 && strongParts.length > 0) {
        // 该字有脱落但未全毁——可以重组
        var weakNames = weakParts.map(function(p){return '['+p+']'+ (RADICAL_DEFS[p]?RADICAL_DEFS[p].name:p);}).join('、');
        var strongNames = strongParts.map(function(p){return '['+p+']'+ (RADICAL_DEFS[p]?RADICAL_DEFS[p].name:p);}).join('+');
       recombineTips.push('「' + c.name + '」不稳——' +weakNames + '在本房间松动，但' +strongNames + '仍牢固。可侧重展示' +strongNames+ '面来守住这个字的核心');
      } else if (weakParts.length === c.parts.length) {
        recombineTips.push('「' + c.name + '」全线承压——所有构成偏旁均偏弱。建议回避此字的正面展示，转为防守姿态');
      }
    });
    var recombineText = recombineTips.length > 0 ? recombineTips.join('；') : '本房间无明显的偏旁脱落风险，六个字的结构保持完整';

    // 房间级战术总结
    var roomTactic = '';
    if (room === 'HR初筛') roomTactic = '快速建立靠谱的第一印象。控制信息输出节奏，不该说的不说——重点展示你的人格稳定感和清晰的表达逻辑。';
    else if (room === '业务面试') roomTactic = '每个回答必须有数据、有逻辑、有复盘。用项目成果说话，展示专业深度。如果经验积累或时间沉淀偏弱，提前准备2个STAR案例补位。';
    else if (room === '交叉面试') roomTactic = '重点是展示协作能力而非个人能力。体现你能和不同风格的人配合——说清楚你的差异化价值和团队互补关系。';
    else if (room === '高管面试') roomTactic = '不只讲做过什么，要讲为什么做、未来怎么做。阐明你的职业动机和行业判断——格局比细节重要。';
    else if (room === 'HR谈薪') roomTactic = '谈判定胜负。谁掌握更多信息谁有主动权——把你的价值论述组织清楚，控制谈判节奏，不要先开口。';

    roomData.push({
      room: room,
      meta: meta,
      // 场景风格
      roomStyle: roomStyle,
      beastShiftText: beastShiftText,
      sceneStyleLabel: sceneStyleLabel,
      ideal: ideal,
      // 能力掌控度
      radTightnessList: radTightnessList,
      weakRads: weakRads,
      strongRads: strongRads,
      controlSummary: controlSummary,
      // 六字评分 + 房间综合
      charScores: charScores,
      roomAvg: roomAvg,
      roomFinal: roomFinal,
      styleMatch: styleMatch,
      matchLabel: matchLabel,
      weakest: weakest,
      strongest: strongest,
      deductions: deductions,
      tactics: tactics,
      recombineText: recombineText,
      roomTactic: roomTactic
    });
  });

  // === 汇总：从房间数据推导总体结论（多数原则，非阈值一刀切）===
  var overall = {};
  // 风格：5个房间中最高频的势×局组合
  var styleVotes = {};
  roomData.forEach(function(rd){
    var key = rd.roomStyle['势'] + '_' + rd.roomStyle['局'];
    styleVotes[key] = (styleVotes[key] || 0) + 1;
  });
  var topKey = '', topCount = 0;
  Object.keys(styleVotes).forEach(function(k){
    if(styleVotes[k] > topCount){ topKey = k; topCount = styleVotes[k]; }
  });
  var parts = topKey.split('_');
  overall.style = { 势: parts[0], 局: parts[1] };
  // 衡和法：房间多数
  var hengVotes={}, faVotes={};
  roomData.forEach(function(rd){
    hengVotes[rd.roomStyle['衡']] = (hengVotes[rd.roomStyle['衡']]||0)+1;
    faVotes[rd.roomStyle['法']] = (faVotes[rd.roomStyle['法']]||0)+1;
  });
  var topHeng='',topFa='',cHeng=0,cFa=0;
  Object.keys(hengVotes).forEach(function(k){if(hengVotes[k]>cHeng){topHeng=k;cHeng=hengVotes[k];}});
  Object.keys(faVotes).forEach(function(k){if(faVotes[k]>cFa){topFa=k;cFa=faVotes[k];}});
  overall.style.衡 = topHeng; overall.style.法 = topFa;
  overall.styleLabel = topKey + '_' + topHeng + '_' + topFa;
  // 风格灵活度
  var sameRoomCount = roomData.filter(function(rd){
    return rd.roomStyle['势'] === overall.style.势 && rd.roomStyle['局'] === overall.style.局;
  }).length;
  overall.flexibility = sameRoomCount; // 和多数风格一致的房间数（越高越稳定，越低越灵活）

  // 字得分：取各房间的中位数（不受极端房间影响）
  var chars = ['能','历','格','望','相','詩'];
  overall.charScores = {};
  chars.forEach(function(cn){
    var scores = [];
    roomData.forEach(function(rd){
      rd.charScores.forEach(function(c){
        if(c.name === cn) scores.push(c.score);
      });
    });
    scores.sort(function(a,b){return a-b;});
    var mid = Math.floor(scores.length/2);
    overall.charScores[cn] = scores.length > 0 ? scores[mid] : 5;
  });

  // 偏旁：中位数聚合
  overall.radicals = {};
  var allRads = ['厶','月','匕','厂','力','木','各','亡','王','目','言','寺'];
  allRads.forEach(function(rad){
    var vals = [];
    roomData.forEach(function(rd){
      rd.radTightnessList.forEach(function(rt){
        if(rt.rad === rad) vals.push(rt.roomVal);
      });
    });
    vals.sort(function(a,b){return a-b;});
    overall.radicals[rad] = vals.length > 0 ? vals[Math.floor(vals.length/2)] : 5;
  });

  return { roomData: roomData, overall: overall };
}


// ===== 报告双页切换 =====
function toggleReportDetail(show) {
  var s = document.getElementById('reportSummary');
  var d = document.getElementById('reportDetail');
  var b = document.getElementById('reportNavBtn');
  if (!s || !d) return;
  s.style.display = show ? 'none' : '';
  d.style.display = show ? '' : 'none';
  if (b) b.style.display = show ? 'none' : '';
  if (show) d.scrollIntoView({behavior:'smooth'});
  else s.scrollIntoView({behavior:'smooth'});
}

// ===== 大白话总结生成 =====
function buildPlainSummary(style, finalDims, roomData, charAssess, totalRoomAvg) {
  // 维度映射到日常语言（阈值与评分系统一致：6分为pole2/pole1分界）
  var dimTalk = {
    '势': finalDims['势']>=8 ? {me:'非常看重外部回报和认可', them:'主动对外展示价值'} :
         finalDims['势']>=6 ? {me:'比较看重外部反馈', them:'愿意表达期望和诉求'} :
         finalDims['势']>=4 ? {me:'更偏内在驱动，有自己的标准', them:'不太主动争取外部资源'} :
         {me:'完全以自己的标准为主', them:'倾向于被动应答而非主动引导'},
    '局': finalDims['局']>=8 ? {me:'典型的长期主义者', them:'擅长从行业趋势和愿景切入'} :
         finalDims['局']>=6 ? {me:'更偏长远视角', them:'能兼顾方向和落地'} :
         finalDims['局']>=4 ? {me:'更关注当下具体的事', them:'务实靠谱，执行力强'} :
         {me:'完全的务实派', them:'优先解决眼前问题，不空谈方向'},
    '衡': finalDims['衡']>=8 ? {me:'习惯用数据和逻辑做判断', them:'理性分析，有理有据'} :
         finalDims['衡']>=6 ? {me:'更偏理性分析', them:'逻辑和人情兼顾'} :
         finalDims['衡']>=4 ? {me:'做决定时会考虑人的因素', them:'在意关系和他人的感受'} :
         {me:'非常看重人和关系', them:'善于理解他人，关注团队和谐'},
    '法': finalDims['法']>=8 ? {me:'非常灵活，享受变化', them:'适应力强，不怕不确定性'} :
         finalDims['法']>=6 ? {me:'比较灵活，能接受变化', them:'在稳定和变化间找平衡'} :
         finalDims['法']>=4 ? {me:'更偏好稳定和明确的规则', them:'做事有章法，让人放心'} :
         {me:'需要确定性和秩序感', them:'深耕一个方向，不轻易改变'}
  };

  // 找到最强和最弱的房间
  var roomsByScore = roomData.slice().sort(function(a,b){return b.roomFinal - a.roomFinal;});
  var bestRoom = roomsByScore[0];
  var worstRoom = roomsByScore[roomsByScore.length-1];

  // 生成大白话段落（自然语言+举例，不出现字名）
  var lines = [];

  // 1. 风格
  var styleIntro = '你是一个' + dimTalk['势'].me + '的人，做选择时' + dimTalk['局'].me + '。' +
    '处理问题时' + dimTalk['衡'].me + '，工作中' + dimTalk['法'].me + '。';
  if(finalDims['势'] >= 7) styleIntro += ' 比如面试官让你谈期望薪资，你不会藏着掖着——直接说出数字和依据让你更自在。';
  else if(finalDims['势'] <= 3) styleIntro += ' 比如面试官追问你的缺点，你更倾向于坦诚内部思考而非包装话术。';
  lines.push('🧭 <b style="color:var(--accent);">风格</b> ' + styleIntro);

  // 2. 场景
  var bestRooms = roomData.slice().sort(function(a,b){return b.roomFinal - a.roomFinal;});
  var top2 = bestRooms.slice(0,2);
  var bottom1 = bestRooms[bestRooms.length-1];
  if(top2.length >= 2 && bottom1){
    var bestNames = top2.map(function(r){return r.room;}).join('和');
    var bestFocus = top2[0].meta.focus;
    lines.push('✅ <b style="color:var(--accent);">优势</b> 在五个面试场景中，你在' + bestNames + '环节最为自在——' + bestFocus + '是你的舒适区。');
    if(bottom1.roomFinal < top2[0].roomFinal - 1){
      lines.push('⚠️ <b style="color:var(--accent);">留意</b> ' + bottom1.room + '环节（' + bottom1.meta.focus + '）可能需要多留个心眼——不必改变自己，但可以提前想好怎么把你的表达方式转成对方想听的语言。');
    }
  }

  // 3. 稳定性
  var se = typeof stabilityEval === 'function' ? stabilityEval() : null;
  if(se){
    lines.push('🔒 <b style="color:var(--accent);">稳定</b> ' + se.style + '——' + se.desc);
  }

  // 4. 建议

// AI提供商预设
var AI_PROVIDERS = {
  '1': {name:'DeepSeek', url:'https://api.deepseek.com/v1/chat/completions', model:'deepseek-chat'},
  '2': {name:'豆包 (字节)', url:'https://ark.cn-beijing.volces.com/api/v3/chat/completions', model:'doubao-pro-32k'},

  '0': {name:'自定义', url:'', model:''}
};

function aiDeepAnalysis(){
  var key = getApiKey();
  var apiUrl = getApiUrl();
  var model = getApiModel();
  if(!key){
    // 第一步：选提供商
    var provList = '';
    Object.keys(AI_PROVIDERS).forEach(function(k){
      provList += '\n  ['+k+'] '+AI_PROVIDERS[k].name;
    });
    var choice = prompt('选择AI模型（输入序号）：'+provList+'\n\n已有Key直接输入序号，需重新配置按取消');
    if(!choice) return;
    choice = choice.trim();
    if(AI_PROVIDERS[choice]){
      var prov = AI_PROVIDERS[choice];
      if(choice !== '0'){
        apiUrl = prov.url; model = prov.model;
      }
    } else {
      // 直接输入了Key
      key = choice;
    }
    // 第二步：输入Key
    if(!key){
      key = prompt('输入 '+AI_PROVIDERS[choice].name+' API Key（仅存本次会话）：');
      if(!key) return;
    }
    if(choice === '0'){
      apiUrl = prompt('API地址：', 'https://api.deepseek.com/v1/chat/completions');
      if(!apiUrl) return;
      model = prompt('模型名：', 'deepseek-chat');
      if(!model) return;
    }
    if(confirm('保存API配置到本设备？\n\n确定=保存（推荐）\n取消=仅本次使用')){
      setApiKey(key); setApiUrl(apiUrl); setApiModel(model);
    }
  }
  var btn = document.getElementById('aiBtn');
  var resultDiv = document.getElementById('aiResult');
  btn.disabled = true; btn.textContent = '🤖 AI分析中...';
  resultDiv.innerHTML = '<div style="text-align:center;padding:20px;color:var(--sub);"><div class="spinner"></div><p>AI正在深度分析你的测试数据，生成个性化策略建议...</p></div>';

  // 构建评估数据摘要
  var r = S.result;
  var rr = computeRoomScores(S.selectedQuestions, S.answers, r.finalRadicals, r.finalDims, r.style);
  var overall = rr.overall;
  var roomData = rr.roomData;
  var style = overall.style;

  // === 核心工具函数：把任何文本中的偏旁符号[厶]翻译成大白话名称 ===
  // AI 看不到符号，自然就不会输出符号
  function translateRadsInText(txt) {
    if (!txt || typeof txt !== 'string') return txt;
    var result = txt;
    // 偏旁符号 → 大白话名称
    Object.keys(RADICAL_DEFS).forEach(function(k) {
      var escaped = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      result = result.replace(new RegExp('\\['+escaped+'\\]', 'g'), '「' + RADICAL_DEFS[k].name + '」');
    });
    // 维度标签 → 大白话（兜底：万一数据里带了标签）
    result = result.replace(/外势/g, '看重外部回报');
    result = result.replace(/内势/g, '看重自我成长');
    result = result.replace(/远局/g, '长期主义');
    result = result.replace(/近局/g, '务实当下');
    result = result.replace(/理衡/g, '理性决策');
    result = result.replace(/情衡/g, '感性决策');
    result = result.replace(/定法/g, '固定方法论');
    result = result.replace(/活法/g, '灵活应变');
    return result;
  }

  // 构建评估数据摘要 —— 所有文本字段都经过 translateRadsInText 清洗，AI 收到的就是纯大白话
  function buildCharLabel(cn) {
    var d = CHAR_DEFS[cn];
    if (!d) return cn;
    // 「能」→ 能（你能做什么：独有能力+时间积累+具体技能）
    var partsPlain = d.parts.map(function(p){ return (RADICAL_DEFS[p]||{}).name||p; }).join('+');
    return cn + '（' + d.core + '：' + partsPlain + '）';
  }

  var weakestGlobalRads = [];
  Object.keys(r.finalRadicals).forEach(function(k){
    weakestGlobalRads.push({
      name: (RADICAL_DEFS[k]||{}).name||k,  // 只用大白话名，不传[符号]
      score: r.finalRadicals[k]
    });
  });
  weakestGlobalRads.sort(function(a,b){return a.score-b.score;});
  weakestGlobalRads = weakestGlobalRads.slice(0,5);

  var summary = {
    nickname: S.nickname,
    typeName: getStyleTypeName(style),
    typeExplain: translateRadsInText( // 类型名用大白话解释
      style.势 === '外势' ? '你的动力来自外部认可，做事关注结果和回报' : '你的动力来自自我成长，做事关注学到了什么'),
    dimStyle: translateRadsInText(
      '能量来源：' + style.势 + '，价值取向：' + style.局 + '，决策方式：' + style.衡 + '，做事方法：' + style.法),
    flexibility: overall.flexibility + '/5房间风格一致',
    weakestAbilities: weakestGlobalRads, // 最弱能力（大白话名+分数）
    rooms: roomData.map(function(rd){
      return {
        room: rd.room,
        matchLabel: rd.matchLabel,
        overallScore: rd.roomFinal,
        rawScore: rd.roomAvg,
        // 该房间最弱和最强的字（已翻译）
        weakestChar: rd.weakest ? buildCharLabel(rd.weakest.name) + ' ' + rd.weakest.score.toFixed(1) + '分' : '无',
        strongestChar: rd.strongest ? buildCharLabel(rd.strongest.name) + ' ' + rd.strongest.score.toFixed(1) + '分' : '无',
        // 薄弱能力（仅保留大白话名+分，不传符号）
        weakAbilities: (rd.weakRads||[]).map(function(wr){ return (RADICAL_DEFS[wr.rad]||{}).name + ' ' + wr.roomVal.toFixed(1) + '分'; }),
        // 扣分原因、战术建议、重组建议 —— 全部经过翻译清洗
        issues: (rd.deductions||[]).map(translateRadsInText),
        tactics: (rd.tactics||[]).map(translateRadsInText),
        recombine: translateRadsInText(rd.recombineText),
        roomStrategy: translateRadsInText(rd.roomTactic)
      };
    })
  };

  // 系统消息：角色 + 硬约束（AI 收到的数据已经是大白话，它没有借口输出符号）
  var systemMsg = '你是一位资深面试教练。你的学员是普通求职者。\n' +
    '铁律三条（违反一条就重写）：\n' +
    '1. 输出中绝对不能出现任何用【】[]（）括起来的符号或标签，哪怕数据里有也不许抄\n' +
    '2. 提到任何能力时，用完整的大白话名称（如「独有能力」「逻辑框架」），不许用简称或符号\n' +
    '3. 每条建议必须引用数据里的具体分数，不许说「建议加强XX」「建议提升XX」这类没有分数的空话\n' +
    '说话像跟学员一对一聊天，不说套话。';

  // 用户消息：数据已是大白话 + 严格格式
  var aiPrompt = '学员「'+(S.nickname||'学员')+'」的面试风格测试结果如下。所有数据已经是通俗中文，请原样使用其中的能力名称，不要自己编词。\n\n' +
    '## 测试数据\n```json\n' + JSON.stringify(summary, null, 2) + '\n```\n\n' +
    '## 输出格式（4章节，不得增减，用### 编号）\n\n' +
    '### 一、战术画像\n' +
    '2-3句大白话描述'+(S.nickname||'学员')+'是什么风格的人。必须：叫出名字、解释类型、指出最强+最弱的能力（带分数）。\n\n' +
    '### 二、五个房间怎么打\n' +
    '每个房间固定格式：\n' +
    '**房间名（综合X分）**\n' +
    '- 风格匹配情况：直接说你的风格和这个房间对不对路、哪里不对路（不许写「主场」「中性」「客场」这三个词）\n' +
    '- 最要补的能力是哪个（写具体名字+分数），为什么这个房间面试官特别看重它\n' +
    '- 给你一个明天就能用的具体打法\n' +
    '- 风格不对路的房间加 ⚠️调整重点：具体怎么做\n\n' +
    '### 三、薄弱能力加固\n' +
    '选最弱的2-3个能力，每个给：\n' +
    '- **能力名（X分）**：弱在哪儿 → 明天面试就能用的一句话术\n' +
    '- 话术要写到「面试官问XX时，你就说：…」这个程度\n\n' +
    '### 四、能力组合思路\n' +
    '拿最强2个能力组合一个独特竞争力，解释为什么这个组合对'+(S.nickname||'学员')+'的类型特别有效。\n\n' +
    '字数600-900，像人话不像论文。';

  // 智能选择代理：本地用Python代理，线上用Vercel函数
  var proxyUrl = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? '/api/ai'
    : 'https://chess-deploy-phi.vercel.app/api/ai';
  fetch(proxyUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Target-URL': apiUrl,
      'X-API-Key': key,
      'X-Model': model
    },
    body: JSON.stringify({
      model: model,
      max_tokens: 2000,
      messages: [
        {role:'system', content:systemMsg},
        {role:'user', content:aiPrompt}
      ]
    })
  })
  .then(function(resp){ return resp.json(); })
  .then(function(data){
    btn.disabled = false; btn.textContent = '🤖 AI深度解读';
    if(data.error){
      resultDiv.innerHTML = '<div style="background:rgba(202,91,91,0.1);border:1px solid #ca5b5b;border-radius:12px;padding:16px;color:#ca5b5b;font-size:13px;">❌ API错误：' + (data.error.message||JSON.stringify(data.error)) + '<br><span style="font-size:11px;"><a onclick="localStorage.removeItem(\'aim_key\');localStorage.removeItem(\'aim_url\');localStorage.removeItem(\'aim_model\');location.reload();" style="color:var(--accent);cursor:pointer;">点击重置API配置</a></span></div>';
      return;
    }
    // 兼容多种API响应格式
    var text = '';
    if(data.choices && data.choices[0]){ text = data.choices[0].message.content; }
    else if(data.content && data.content[0]){ text = data.content[0].text; }
    else if(data.response){ text = data.response; }
    else { text = JSON.stringify(data); }

    // 前端兜底清洗：AI不听话时，暴力移除所有残留的偏旁符号和维度标签
    text = translateRadsInText(text);
    // 额外清洗：中括号包裹的任何单字（如[望][詩]），AI可能自创
    text = text.replace(/\[[^\]]{1,2}\]/g, '');
    // 清洗残留的「主场」「中性」「客场」标签
    text = text.replace(/匹配度[：:]\s*(主场|中性|客场)/g, '匹配情况');
    text = text.replace(/（主场）|（中性）|（客场）/g, '');
    text = text.replace(/主场|客场/g, function(m){ return m==='主场'?'风格对路':m==='客场'?'风格不太对路':m; });

    // 简单Markdown渲染
    var html = text
      .replace(/### (.+)/g, '<h4 style="color:var(--accent);margin:12px 0 6px;">$1</h4>')
      .replace(/## (.+)/g, '<h3 style="color:var(--accent);margin:16px 0 8px;">$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/- (.+)/g, '<div style="margin:4px 0 4px 12px;font-size:13px;">• $1</div>')
      .replace(/\n\n/g, '<br><br>');
    resultDiv.innerHTML = '<div style="background:rgba(124,58,237,0.08);border:2px solid rgba(124,58,237,0.3);border-radius:14px;padding:20px;margin-top:16px;line-height:1.8;font-size:13px;color:var(--text);">' +
      '<div style="color:#a855f7;font-weight:700;margin-bottom:12px;font-size:15px;">🤖 AI深度解读</div>' + html + '</div>';
  })
  .catch(function(e){
    btn.disabled = false; btn.textContent = '🤖 AI深度解读';
    resultDiv.innerHTML = '<div style="background:rgba(202,91,91,0.1);border:1px solid #ca5b5b;border-radius:12px;padding:16px;color:#ca5b5b;font-size:13px;line-height:1.8;">' +
      '<strong>❌ 网络错误：</strong>' + e.message + '<br><br>' +
      '请检查网络连接后重试。<br>' +
      '如使用本地版：<code style="background:rgba(0,0,0,0.3);padding:4px 8px;border-radius:4px;">python3 server_proxy.py</code><br><br>' +
      '<a href="#" onclick="localStorage.removeItem(\'aim_key\');location.reload();" style="color:var(--accent);">重置API配置</a></div>';
  });
}

// 启动
const initData=getStorage(); S.nickname=initData.nickname||'';
render();
</script>
</body>
</html>
